name: 拉取并转换订阅

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

env:
  SOURCE_URL: "https://raw.githubusercontent.com/ishalumi/proxy-node-collector/main/output/nodes_base64.txt"

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 下载 subconverter 工具
        run: |
          wget -L -O subconverter.tar.gz https://github.com/MetaCubeX/subconverter/releases/latest/download/subconverter_linux64.tar.gz
          tar -xzf subconverter.tar.gz
          rm subconverter.tar.gz

      - name: 下载并解码源 Base64
        run: |
          curl -sL "${SOURCE_URL}" | tr -d '\n\r' | base64 -d > nodes.txt 2>/dev/null
          if [ ! -s nodes.txt ]; then
            echo "❌ 解码失败或为空"
            exit 1
          fi
          echo "✅ 节点文件大小: $(wc -c < nodes.txt) 字节"

      - name: 启动本地 HTTP 服务器
        run: |
          python3 -m http.server 8080 --directory . &
          echo $! > http.pid
          sleep 2  # 确保服务已启动

      - name: 单次转换（不启动 HTTP 服务）
        run: |
          cd subconverter
          # 直接使用 -u 参数，URL 为本地 HTTP 服务器提供的节点文件，很短，无参数长度问题
          ./subconverter -u "http://127.0.0.1:8080/nodes.txt" -t clash -o ../clash.yaml
          cd ..

          if [ ! -s clash.yaml ]; then
            echo "❌ 转换结果为空"
            exit 1
          fi
          if grep -q "proxies:" clash.yaml; then
            echo "✅ 转换成功，文件大小: $(wc -c < clash.yaml) 字节"
          else
            echo "⚠️ 警告：结果可能不是完整 YAML，前200字符："
            head -c 200 clash.yaml
          fi

      - name: 停止 HTTP 服务器
        run: |
          kill $(cat http.pid) 2>/dev/null || true
          pkill -f "python3 -m http.server" || true

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clash.yaml
          git commit -m "自动同步转换 $(date +'%Y-%m-%d %H:%M')" || echo "无变化"
          git push
