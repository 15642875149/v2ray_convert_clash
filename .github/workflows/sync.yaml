name: 拉取并转换订阅

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

env:
  SOURCE_URL: "https://raw.githubusercontent.com/ishalumi/proxy-node-collector/main/output/nodes_base64.txt"

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 下载 subconverter 工具
        run: |
          wget -L -O subconverter.tar.gz https://github.com/MetaCubeX/subconverter/releases/latest/download/subconverter_linux64.tar.gz
          tar -xzf subconverter.tar.gz
          rm subconverter.tar.gz

      - name: 下载源 Base64 并生成配置文件
        id: prepare
        run: |
          # 下载并去掉换行符（防止 Base64 分段）
          BASE64=$(curl -sL "${SOURCE_URL}" | tr -d '\n\r')
          if [ -z "$BASE64" ]; then
            echo "❌ 源文件为空"
            exit 1
          fi
          echo "✅ 源 Base64 长度: ${#BASE64} 字符"

          cd subconverter
          # 生成 pref.ini，使用 here-doc 写入，避免命令行参数过长
          cat > pref.ini <<EOF
          [common]
          api_mode=false
          default_url=data:text/plain;base64,${BASE64}
          type=mixed
          target=clash
          EOF
          cd ..

      - name: 执行格式转换
        run: |
          cd subconverter
          ./subconverter -f pref.ini -o ../clash.yaml
          cd ..

          # 检查生成的文件
          if [ ! -s clash.yaml ]; then
            echo "❌ 转换结果为空"
            exit 1
          fi

          # 简单验证是否包含 proxies:
          if ! grep -q "proxies:" clash.yaml; then
            echo "⚠️ 警告：转换结果可能不是有效的 Clash YAML，前200字符如下："
            head -c 200 clash.yaml
          else
            echo "✅ 转换成功，文件大小: $(wc -c < clash.yaml) 字节"
          fi

      - name: 提交并推送转换结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clash.yaml
          git commit -m "自动同步转换 $(date +'%Y-%m-%d %H:%M')" || echo "内容无变化，跳过提交"
          git push
