name: 拉取并转换订阅 (Python + 自动修正)

on:
  schedule:
    - cron: '0 */2 * * *'   # 每2小时运行一次
  workflow_dispatch:        # 支持手动触发

env:
  SOURCE_URL: "https://raw.githubusercontent.com/ishalumi/proxy-node-collector/main/output/nodes_base64.txt"

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python 依赖
        run: |
          pip install pyyaml requests

      - name: 下载 Subscription-Converter 脚本
        run: |
          wget -O subscription_converter.py https://raw.githubusercontent.com/l-ning/Subscription-Converter/main/subscription_converter.py

      - name: 下载并解码源 Base64
        run: |
          curl -sL "${SOURCE_URL}" | tr -d '\n\r' | base64 -d > nodes.txt 2>/dev/null
          if [ ! -s nodes.txt ]; then
            echo "❌ 解码失败或为空"
            exit 1
          fi
          echo "✅ 节点文件大小: $(wc -c < nodes.txt) 字节"

      - name: 执行格式转换（Python）
        run: |
          python3 subscription_converter.py nodes.txt --file -t advanced -o clash.yaml
          if [ ! -s clash.yaml ]; then
            echo "❌ 转换结果为空"
            exit 1
          fi

      - name: 后处理修正 REALITY 节点 TLS 字段
        run: |
          python3 << 'EOF'
          import yaml

          # 读取 clash.yaml
          with open('clash.yaml', 'r', encoding='utf-8') as f:
              config = yaml.safe_load(f)

          # 修正所有 vless 节点中可能缺失 tls 和 security 的情况
          modified = False
          for proxy in config.get('proxies', []):
              # 如果节点类型是 vless 且包含 reality-opts 字段
              if proxy.get('type') == 'vless' and proxy.get('reality-opts'):
                  # 确保 tls 为 true
                  if proxy.get('tls') is not True:
                      proxy['tls'] = True
                      modified = True
                  # 确保 security 为 reality
                  if proxy.get('security') != 'reality':
                      proxy['security'] = 'reality'
                      modified = True
              # 如果节点类型是 vless 且 server 包含 .sslip.io 等典型 reality 特征，也补全
              elif proxy.get('type') == 'vless' and 'reality' in str(proxy.get('reality-opts', {})):
                  if proxy.get('tls') is not True:
                      proxy['tls'] = True
                      modified = True
                  if proxy.get('security') != 'reality':
                      proxy['security'] = 'reality'
                      modified = True

          if modified:
              with open('clash.yaml', 'w', encoding='utf-8') as f:
                  yaml.dump(config, f, allow_unicode=True, sort_keys=False)
              print("✅ 已自动修正 REALITY 节点的 TLS 字段")
          else:
              print("ℹ️ 未发现需要修正的节点")

          EOF

      - name: 验证最终文件
        run: |
          if grep -q "proxies:" clash.yaml; then
            echo "✅ 转换成功，文件大小: $(wc -c < clash.yaml) 字节"
          else
            echo "❌ 最终文件无效"
            exit 1
          fi

      - name: 提交并推送转换结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.github.com"
          git add clash.yaml
          git commit -m "自动同步转换 $(date +'%Y-%m-%d %H:%M')" || echo "内容无变化，跳过提交"
          git push
