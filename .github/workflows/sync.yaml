name: 拉取并转换订阅

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

env:
  SOURCE_URL: "https://raw.githubusercontent.com/ishalumi/proxy-node-collector/main/output/nodes_base64.txt"

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 下载 subconverter 工具
        run: |
          wget -L -O subconverter.tar.gz https://github.com/MetaCubeX/subconverter/releases/latest/download/subconverter_linux64.tar.gz
          tar -xzf subconverter.tar.gz
          rm subconverter.tar.gz

      - name: 下载并解码源 Base64
        run: |
          curl -sL "${SOURCE_URL}" | tr -d '\n\r' | base64 -d > nodes.txt 2>/dev/null
          if [ ! -s nodes.txt ]; then
            echo "❌ 解码失败或为空"
            exit 1
          fi
          echo "✅ 节点文件大小: $(wc -c < nodes.txt) 字节"
          echo "--- 前200字符 ---"
          head -c 200 nodes.txt
          echo ""

      - name: 启动本地 HTTP 服务器和 subconverter 服务
        run: |
          python3 -m http.server 8080 --directory . &
          echo $! > http.pid
          cd subconverter
          ./subconverter &
          echo $! > ../sc.pid
          cd ..
          sleep 3
          echo "✅ 服务已启动"

      - name: 调用 API 转换（带规则模板）
        run: |
          # 使用 clash_rule_base 参数指定在线规则模板，生成完整 Clash 配置
          curl -G -s \
            --data-urlencode "url=http://127.0.0.1:8080/nodes.txt" \
            --data "target=clash" \
            --data "type=mixed" \
            --data "clash_rule_base=https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/config/ACL4SSR_Online.ini" \
            "http://127.0.0.1:25500/get" \
            -o clash.yaml

          if [ ! -s clash.yaml ]; then
            echo "❌ 转换结果为空"
            exit 1
          fi

          # 验证是否包含 proxies 和 proxy-groups
          if grep -q "proxies:" clash.yaml && grep -q "proxy-groups:" clash.yaml; then
            echo "✅ 转换成功，文件大小: $(wc -c < clash.yaml) 字节"
          else
            echo "⚠️ 警告：可能缺少 proxy-groups 或 proxies，前200字符："
            head -c 200 clash.yaml
          fi

      - name: 停止服务（清理）
        run: |
          kill $(cat sc.pid) 2>/dev/null || true
          kill $(cat http.pid) 2>/dev/null || true
          pkill -f "subconverter" || true
          pkill -f "python3 -m http.server" || true

      - name: 提交并推送转换结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.github.com"
          git add clash.yaml
          git commit -m "自动同步转换 $(date +'%Y-%m-%d %H:%M')" || echo "内容无变化，跳过提交"
          git push
