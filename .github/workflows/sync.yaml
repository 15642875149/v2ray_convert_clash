name: 拉取并转换订阅

on:
  schedule:
    - cron: '0 */2 * * *'   # 每2小时一次
  workflow_dispatch:        # 手动触发

env:
  SOURCE_URL: "https://raw.githubusercontent.com/ishalumi/proxy-node-collector/main/output/nodes_base64.txt"

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 下载 subconverter 工具
        run: |
          wget -L -O subconverter.tar.gz https://github.com/MetaCubeX/subconverter/releases/latest/download/subconverter_linux64.tar.gz
          tar -xzf subconverter.tar.gz
          rm subconverter.tar.gz

      - name: 下载源 Base64 并执行转换
        run: |
          # 下载并去除换行
          BASE64=$(curl -sL "${SOURCE_URL}" | tr -d '\n\r')
          if [ -z "$BASE64" ]; then
            echo "❌ 源文件为空"
            exit 1
          fi
          echo "✅ Base64 长度: ${#BASE64} 字符"

          cd subconverter
          # 直接使用命令行参数，不会启动 HTTP 服务，转换后立即退出
          ./subconverter -u "data:text/plain;base64,${BASE64}" -t clash -o ../clash.yaml
          cd ..

          # 检查结果
          if [ ! -s clash.yaml ]; then
            echo "❌ 转换结果为空"
            exit 1
          fi
          if grep -q "proxies:" clash.yaml; then
            echo "✅ 转换成功，文件大小: $(wc -c < clash.yaml) 字节"
          else
            echo "⚠️ 警告：转换结果可能不是有效 Clash YAML，前200字符："
            head -c 200 clash.yaml
          fi

      - name: 提交并推送转换结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clash.yaml
          git commit -m "自动同步转换 $(date +'%Y-%m-%d %H:%M')" || echo "内容无变化，跳过提交"
          git push
