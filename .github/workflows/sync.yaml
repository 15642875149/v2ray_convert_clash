name: 拉取并转换订阅

on:
  schedule:
    - cron: '0 */2 * * *'   # 每2小时一次
  workflow_dispatch:        # 手动触发

env:
  # ⚠️ 替换成你的真实 Raw 源地址
  SOURCE_URL: "https://raw.githubusercontent.com/ishalumi/proxy-node-collector/main/output/nodes_base64.txt"

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: 检出你的仓库
        uses: actions/checkout@v4

      - name: 下载 subconverter 转换工具
        run: |
          wget -L -O subconverter.tar.gz https://github.com/MetaCubeX/subconverter/releases/latest/download/subconverter_linux64.tar.gz
          tar -xzf subconverter.tar.gz
          rm subconverter.tar.gz

      - name: 执行格式转换（V2Ray → Clash）
        run: |
          cd subconverter
          # 生成配置文件，值加上双引号
          cat > pref.ini <<EOF
          [common]
          api_mode=false
          default_url="${SOURCE_URL}"
          target="clash"
          EOF
          # 单次转换，直接输出到仓库根目录的 clash.yaml，完成后退出
          ./subconverter -f pref.ini -o ../clash.yaml
          cd ..

      - name: 提交并推送转换结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clash.yaml
          git commit -m "自动同步转换 $(date +'%Y-%m-%d %H:%M')" || echo "内容无变化，跳过提交"
          git push
