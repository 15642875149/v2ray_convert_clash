name: 拉取并转换订阅 (第三方库 + 后处理补全)

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

env:
  SOURCE_URL: "https://raw.githubusercontent.com/ishalumi/proxy-node-collector/main/output/nodes_base64.txt"

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python 依赖
        run: pip install pyyaml requests

      - name: 下载 Subscription-Converter 脚本
        run: |
          wget -O subscription_converter.py https://raw.githubusercontent.com/l-ning/Subscription-Converter/main/subscription_converter.py

      - name: 下载并解码源 Base64
        run: |
          curl -sL "${SOURCE_URL}" | tr -d '\n\r' | base64 -d > nodes.txt 2>/dev/null
          if [ ! -s nodes.txt ]; then
            echo "❌ 解码失败或为空"
            exit 1
          fi
          echo "✅ 节点文件大小: $(wc -c < nodes.txt) 字节"

      - name: 执行格式转换（第三方库）
        run: |
          python3 subscription_converter.py nodes.txt --file -t advanced -o clash.yaml
          if [ ! -s clash.yaml ]; then
            echo "❌ 转换结果为空，请检查 subscription_converter.py 是否支持您的协议"
            exit 1
          fi
          echo "✅ 转换完成，clash.yaml 大小: $(wc -c < clash.yaml) 字节"

      - name: 后处理补全缺失的 Reality 字段
        run: |
          python3 << 'EOF'
          import re
          import urllib.parse
          import yaml
          import sys

          # 读取 nodes.txt 构建映射表
          reality_map = {}
          with open('nodes.txt', 'r', encoding='utf-8') as f:
              for line in f:
                  line = line.strip()
                  if not line.startswith('vless://'):
                      continue
                  try:
                      raw = line[8:]
                      parts = raw.split('?', 1)
                      user_host = parts[0]
                      host = user_host.split('@', 1)[1].split(':', 1)[0]
                      params = {}
                      if len(parts) > 1:
                          params = dict(urllib.parse.parse_qsl(parts[1].split('#', 1)[0]))
                      if params.get('security') == 'reality':
                          reality_map[host] = {
                              'pbk': params.get('pbk', ''),
                              'sid': params.get('sid', '')
                          }
                  except Exception as e:
                      print(f"⚠️ 解析节点失败: {line[:50]}... 错误: {e}")
                      continue

          if not reality_map:
              print("ℹ️ 未发现 Reality 节点需要补全")
              # 即使没有reality节点，也要确保文件有效，直接退出
              sys.exit(0)

          # 读取 clash.yaml，检查是否有效
          try:
              with open('clash.yaml', 'r', encoding='utf-8') as f:
                  content = f.read().strip()
                  if not content:
                      print("❌ clash.yaml 文件为空")
                      sys.exit(1)
                  # 重新定位文件指针，用 yaml 解析
                  f.seek(0)
                  config = yaml.safe_load(f)
          except Exception as e:
              print(f"❌ 读取 clash.yaml 失败: {e}")
              sys.exit(1)

          # 如果 config 为 None 或不是字典，则报错
          if not isinstance(config, dict):
              print(f"❌ clash.yaml 内容无效，无法解析: {content[:200]}")
              sys.exit(1)

          modified = False
          for proxy in config.get('proxies', []):
              if proxy.get('type') != 'vless':
                  continue
              server = proxy.get('server', '')
              if server not in reality_map:
                  continue
              # 检查节点是否有 reality-opts
              if 'reality-opts' not in proxy:
                  # 完全没有，创建并补全
                  proxy['reality-opts'] = {
                      'public-key': reality_map[server]['pbk']
                  }
                  if reality_map[server]['sid']:
                      proxy['reality-opts']['short-id'] = reality_map[server]['sid']
                  proxy['tls'] = True
                  proxy['security'] = 'reality'
                  modified = True
                  print(f"✅ 补全节点 (完全缺失): {proxy.get('name', '')} ({server})")
              else:
                  ro = proxy['reality-opts']
                  # 补全缺失的字段
                  if not ro.get('public-key') and reality_map[server]['pbk']:
                      ro['public-key'] = reality_map[server]['pbk']
                      modified = True
                  if not ro.get('short-id') and reality_map[server]['sid']:
                      ro['short-id'] = reality_map[server]['sid']
                      modified = True
                  if modified:
                      print(f"✅ 补全节点 (部分缺失): {proxy.get('name', '')} ({server})")

          if modified:
              with open('clash.yaml', 'w', encoding='utf-8') as f:
                  yaml.dump(config, f, allow_unicode=True, sort_keys=False)
              print("✅ 已补全缺失的 Reality 字段")
          else:
              print("ℹ️ 未发现需要补全的节点")

          EOF

      - name: 验证最终文件
        run: |
          if grep -q "proxies:" clash.yaml; then
            echo "✅ 转换成功，文件大小: $(wc -c < clash.yaml) 字节"
          else
            echo "❌ 最终文件无效，缺少 proxies:"
            cat clash.yaml
            exit 1
          fi

      - name: 提交并推送转换结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.github.com"
          git add clash.yaml
          git commit -m "自动同步转换 $(date +'%Y-%m-%d %H:%M')" || echo "内容无变化，跳过提交"
          git push
