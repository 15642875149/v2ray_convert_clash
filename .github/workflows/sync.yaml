name: 拉取并转换订阅

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

env:
  SOURCE_URL: "https://raw.githubusercontent.com/ishalumi/proxy-node-collector/main/output/nodes_base64.txt"

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 下载 subconverter 工具
        run: |
          wget -L -O subconverter.tar.gz https://github.com/MetaCubeX/subconverter/releases/latest/download/subconverter_linux64.tar.gz
          tar -xzf subconverter.tar.gz
          rm subconverter.tar.gz

      - name: 下载并解码源 Base64
        id: decode
        run: |
          # 下载并去除换行
          curl -sL "${SOURCE_URL}" | tr -d '\n\r' > base64.txt
          if [ ! -s base64.txt ]; then
            echo "❌ 下载失败或为空"
            exit 1
          fi
          # Base64 解码
          base64 -d base64.txt > nodes.txt 2>/dev/null
          if [ ! -s nodes.txt ]; then
            echo "❌ Base64 解码失败或结果为空"
            exit 1
          fi
          echo "✅ 解码后节点文件大小: $(wc -c < nodes.txt) 字节"
          echo "--- 前200字符 ---"
          head -c 200 nodes.txt
          echo ""

      - name: 执行格式转换（V2Ray → Clash）
        run: |
          cd subconverter
          # 使用 file:// 绝对路径，不启动服务
          ./subconverter -u "file://$(realpath ../nodes.txt)" -t clash -o ../clash.yaml
          cd ..

          # 检查转换结果
          if [ ! -s clash.yaml ]; then
            echo "❌ 转换结果为空"
            exit 1
          fi
          if grep -q "proxies:" clash.yaml; then
            echo "✅ 转换成功，文件大小: $(wc -c < clash.yaml) 字节"
          else
            echo "⚠️ 警告：可能不是有效 Clash YAML，前200字符："
            head -c 200 clash.yaml
          fi

      - name: 提交并推送转换结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clash.yaml
          git commit -m "自动同步转换 $(date +'%Y-%m-%d %H:%M')" || echo "内容无变化，跳过提交"
          git push
